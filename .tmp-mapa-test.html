<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teste mapa — CSS real</title>
<link rel="stylesheet" href="/src/styles/global.css" />
<link rel="stylesheet" href="/src/features/theme/themes.css" />
<link rel="stylesheet" href="/src/shared/ui/ui.css" />
<link rel="stylesheet" href="/src/app/layout/shell.css" />
<link rel="stylesheet" href="/src/features/calendario/calendario.css" />
</head>
<body>
  <div class="shell">
    <div class="pagina calendario-pagina">
      <div class="calendario-toolbar">
        <div class="segmentado calendario-vistas" role="group" aria-label="Vista do calendário">
          <button type="button">Dia</button>
          <button type="button">Semana</button>
          <button type="button">Mês</button>
        </div>
      </div>

      <!-- preenchimento para a página rolar verticalmente -->
      <div style="height: 60vh; background: var(--cor-superficie); border: 1px solid var(--cor-borda)">
        calendário (mock)
      </div>

      <section class="timeline-section">
        <header class="timeline-cabecalho">
          <h2 class="cartao-titulo">Mapa de horas</h2>
          <span class="timeline-date">seg, 26 de out</span>
        </header>
      </section>

      <div class="day-timeline">
        <ul class="timeline-sem-hora" aria-label="itens sem horário">
          <li class="timeline-sem-hora-linha">
            <button type="button" class="timeline-sem-hora-item"><span>Item sem horário</span></button>
          </li>
        </ul>

        <div class="timeline-viewport" id="viewport">
          <div class="timeline-scroll" style="height: 640px; --timeline-cols: 3">
            <div class="timeline-gutter" id="gutter">
              <span class="timeline-hour" style="top: 12px">08:00</span>
              <span class="timeline-hour" style="top: 76px">09:00</span>
              <span class="timeline-hour" style="top: 140px">10:00</span>
              <span class="timeline-hour" style="top: 204px">11:00</span>
              <span class="timeline-hour" style="top: 268px">12:00</span>
            </div>

            <div class="timeline-track">
              <span class="timeline-rule" style="top: 12px"></span>
              <span class="timeline-rule" style="top: 76px"></span>
              <span class="timeline-rule" style="top: 140px"></span>
              <span class="timeline-rule" style="top: 204px"></span>
              <span class="timeline-rule" style="top: 268px"></span>

              <div class="timeline-event" style="top: 20px; height: 56px; --col: 0; --cols: 3; --gap: 8px">
                <button type="button" class="timeline-event-main">
                  <span class="timeline-event-icon"></span>
                  <span class="timeline-event-body">
                    <span class="timeline-event-title">Reunião de alinhamento</span>
                    <span class="timeline-event-time">08:00</span>
                  </span>
                </button>
              </div>
              <div class="timeline-event" style="top: 20px; height: 56px; --col: 1; --cols: 3; --gap: 8px">
                <button type="button" class="timeline-event-main">
                  <span class="timeline-event-icon"></span>
                  <span class="timeline-event-body">
                    <span class="timeline-event-title">Consulta médica</span>
                    <span class="timeline-event-time">08:00</span>
                  </span>
                </button>
              </div>
              <div class="timeline-event" style="top: 20px; height: 56px; --col: 2; --cols: 3; --gap: 8px">
                <button type="button" class="timeline-event-main">
                  <span class="timeline-event-icon"></span>
                  <span class="timeline-event-body">
                    <span class="timeline-event-title">Entrega do relatório</span>
                    <span class="timeline-event-time">08:00</span>
                  </span>
                </button>
              </div>
              <div class="timeline-event" style="top: 148px; height: 56px; --col: 0; --cols: 3; --gap: 8px">
                <button type="button" class="timeline-event-main">
                  <span class="timeline-event-icon"></span>
                  <span class="timeline-event-body">
                    <span class="timeline-event-title">Standup diário</span>
                    <span class="timeline-event-time">10:00</span>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="height: 60vh; background: var(--cor-superficie); border: 1px solid var(--cor-borda)">
        rodapé (mock)
      </div>
    </div>
  </div>

  <script>
    // Qual elemento é o container de rolagem horizontal do gutter?
    function scrollContainerOf(el) {
      let node = el.parentElement
      while (node && node !== document.documentElement) {
        const ox = getComputedStyle(node).overflowX
        if (ox === 'auto' || ox === 'scroll') return node
        node = node.parentElement
      }
      return null
    }
    window.__info = () => {
      const vp = document.getElementById('viewport')
      const gutter = document.getElementById('gutter')
      return {
        overflowContainer: (scrollContainerOf(gutter) || {}).id || (scrollContainerOf(gutter) || {}).className || null,
        vpClientWidth: vp.clientWidth,
        vpScrollWidth: vp.scrollWidth,
      }
    }
  </script>
</body>
</html>
