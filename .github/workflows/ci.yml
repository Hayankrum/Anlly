name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O client do Prisma é gerado (server/generated/ está no .gitignore);
      # sem ele o typecheck falha no import e todos os callbacks de
      # transação viram 'any' implícito.
      - name: Gerar client do Prisma
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test
