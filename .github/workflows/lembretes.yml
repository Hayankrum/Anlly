name: Disparar lembretes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de lembretes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets APP_URL e CRON_SECRET no repositório."
            exit 1
          fi
          curl -fsS -X POST "$APP_URL/api/cron/lembretes" \
            -H "Authorization: Bearer $CRON_SECRET"
